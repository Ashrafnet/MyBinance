name: Android APKon:  workflow_dispatch:jobs:  build:    runs-on: ubuntu-latest    defaults:      run:        working-directory: mobile    steps:      - name: Checkout mobile branch        uses: actions/checkout@v5        with:          ref: mobile      - name: Setup Node        uses: actions/setup-node@v5        with:          node-version: 24          cache: npm          cache-dependency-path: mobile/package-lock.json      - name: Setup Java        uses: actions/setup-java@v5        with:          distribution: temurin          java-version: 21      - name: Setup Android SDK        uses: android-actions/setup-android@v4      - name: Ensure Android debug keystore        run: |          mkdir -p "$HOME/.android"          KS="$HOME/.android/debug.keystore"          if [ ! -f "$KS" ]; then            keytool -genkeypair -v \              -keystore "$KS" \              -storepass android \              -alias androiddebugkey \              -keypass android \              -keyalg RSA \              -keysize 2048 \              -validity 10000 \              -dname "CN=Android Debug,O=Android,C=US"          fi      - name: Install npm deps        run: npm install --no-fund --no-audit      - name: Build web + sync Capacitor        run: |          npm run build          npx cap sync android      - name: Make gradlew executable        run: chmod +x android/gradlew      - name: Build debug APK        working-directory: mobile/android        run: ./gradlew assembleDebug --no-daemon      - name: Sign + verify APK        run: |          set -euo pipefail          APK="android/app/build/outputs/apk/debug/app-debug.apk"          OUT="android/app/build/outputs/apk/debug/MyExchanges-debug.apk"          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"          KS="$HOME/.android/debug.keystore"          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$OUT.aligned"          "$BUILD_TOOLS/apksigner" sign \            --ks "$KS" \            --ks-pass pass:android \            --key-pass pass:android \            --ks-key-alias androiddebugkey \            --out "$OUT" \            "$OUT.aligned"          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"          ls -lh "$OUT"      - name: Upload APK        uses: actions/upload-artifact@v5        with:          name: MyExchanges-debug          path: mobile/android/app/build/outputs/apk/debug/MyExchanges-debug.apk          if-no-files-found: error